services:
  - type: web
    name: limite-game-api
    env: node
    rootDir: multiplayer/server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: limite-game-web
    env: static
    rootDir: multiplayer/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: limite-game-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
